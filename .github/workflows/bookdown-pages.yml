name: Render and Deploy Bookdown

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitBook
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      # 3. Set up Pandoc (needed for Bookdown)
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # OPTIONAL: Spatial system dependencies
      #
      # Uncomment the entire step below if you reintroduce
      # packages such as leaflet, raster, or terra.
      # This step must run BEFORE setup-renv.
      #
      # - name: Install spatial system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       gdal-bin \
      #       libgdal-dev \
      #       libgeos-dev \
      #       libproj-dev \
      #       libpng-dev

      # 4. Restore packages from renv.lock
      - name: Restore R dependencies
        uses: r-lib/actions/setup-renv@v2

      # 5. Render GitBook HTML only
      - name: Render GitBook
        run: |
          Rscript -e 'bookdown::render_book(
            "index.Rmd",
            output_format = "bookdown::gitbook"
          )'

      # 6. Verify build output
      - name: Verify generated website
        run: |
          test -f _book/index.html
          echo "GitBook generated successfully."

      # 7. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 8. Upload the generated website
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 9. Publish the previously built website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
